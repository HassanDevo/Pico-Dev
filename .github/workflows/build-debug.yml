name: Build Pico Dev debug APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'agy_ide_bridge/go.mod'

      - name: Install SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: echo "name=$(python3 scripts/release_version.py name)" >> "$GITHUB_OUTPUT"

      - name: Build all debug APK variants
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --chroot
          ./scripts/build_all_apks.sh --x86_64

      - name: Generate checksums
        run: cd output && sha256sum PicoDev-*.apk > SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PicoDev-debug
          path: output/*
          if-no-files-found: error

      - name: Publish debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Pico Dev v${{ steps.version.outputs.name }} (debug)
          body: |
            Debug-signed APKs built from this source by GitHub Actions.
            Checksums: SHA256SUMS.txt
          prerelease: false
          make_latest: true
          files: |
            output/PicoDev-v${{ steps.version.outputs.name }}.apk
            output/PicoDev-v${{ steps.version.outputs.name }}-chroot.apk
            output/PicoDev-v${{ steps.version.outputs.name }}-x86_64.apk
            output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
